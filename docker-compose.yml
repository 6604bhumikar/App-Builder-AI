services:
  api:
    build:
      context: ./backend
    command: uvicorn app_builder_ai.main:app --host 0.0.0.0 --port 8100
    ports:
      - "8100:8100"
    env_file:
      - ./backend/.env.example

  console:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8100
    depends_on:
      - api
