services:
  - type: web
    name: app-builder-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_builder_ai.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_BUILDER_API_PREFIX
        value: /api
      - key: APP_BUILDER_LLM_MODEL
        value: gpt-4o-mini
